[project]
name = "hackathon"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "flask>=3.1.3",
    "matplotlib>=3.11.2",
    "numba>=0.68.1",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "requests>=2.34.2",
    "seaborn>=0.13.2",
    "torch>=2.15.0",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"
# NOTE: each package is added here when its segment is built.
module-name = ["dataset", "fixes", "benchmark", "originals", "hmm", "mcm", "segment", "mdp", "learned", "serve"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
